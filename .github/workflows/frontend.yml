name: Frontend CI

on:
  pull_request:
    branches:
      - frontend

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Build frontend
        id: build
        run: npm run build

      - name: Trivy security
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Upload frontend build
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Frontend CI failed."

          